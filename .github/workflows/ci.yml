name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Node dependencies
        run: npm.cmd ci

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: npm.cmd run format:check

      - name: Typecheck
        run: npm.cmd run typecheck

      - name: Run tests
        run: npm.cmd test

      - name: Run lint
        run: npm.cmd run lint

      - name: Run Python tests
        run: python -m pytest

      - name: Run Ruff lint
        run: python -m ruff check python_src python_tests

      - name: Check Python formatting
        run: python -m ruff format --check python_src python_tests
